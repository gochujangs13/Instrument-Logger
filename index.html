<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3M Instrument Logger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

<!-- ── Topbar ─────────────────────────────────────────────────────────────── -->
<header id="topbar">
  <button class="home-btn" onclick="app.goHome()">⌂ Home</button>
  <div class="title">
    <span class="brand">3M</span> Instrument Logger
    <span class="device-name" id="deviceName"></span>
  </div>
  <div class="topbar-right">
    <label class="top-setting">
      <span data-i18n="theme_setting">테마</span>
      <select id="themeSelect" onchange="app.setTheme(this.value)">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>
    <label class="top-setting">
      <span data-i18n="lang_setting">언어</span>
      <select id="langSelect" onchange="app.setLang(this.value)">
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </label>
    <span class="conn-badge">
      <span id="connDot" class="conn-dot off"></span>
      <span id="connText" data-i18n="disconnected">연결 안됨</span>
    </span>
  </div>
</header>

<!-- ── Launcher ──────────────────────────────────────────────────────────── -->
<div id="launcher">
  <div class="launcher-hero">
    <h2 data-i18n="launcher_subtitle">계측기를 선택하세요</h2>
  </div>
  <div id="launcherCards" class="cards-grid"></div>
</div>

<!-- ── Instrument View ───────────────────────────────────────────────────── -->
<div id="instrumentView" hidden>
  <div id="layout">

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar">
      <!-- Scrollable panels -->
      <div class="sidebar-top" id="sidebarTop">

        <!-- Connection -->
        <div class="panel">
          <div class="field-label" data-i18n="conn_btn">장비 연결 (Web Serial)</div>
          <div class="conn-row">
            <select id="portSelect" class="inp port-sel"></select>
            <button class="icon-btn" onclick="app.refreshPorts()" data-i18n-title="refresh_tip" title="새로고침">↻</button>
          </div>
          <div id="connStatus" class="conn-status-lbl" data-i18n="disconnected">Disconnected</div>
          <button id="btnConnect" class="big-btn" onclick="app.toggleConnection()" data-i18n="conn_btn">디바이스 연결</button>
          <button class="manage-btn" onclick="app.openTestManager()" data-i18n="test_manage">테스트 방법 관리</button>
        </div>

        <!-- Split -->
        <div class="panel" id="splitPanel">
          <div class="field-label" data-i18n="split_view">출력 분할 화면:</div>
          <div class="toggle-row" id="splitToggle">
            <button class="toggle-btn active" data-val="1" onclick="app.setSplit(1)">1 <span data-i18n="screens">화면</span></button>
            <button class="toggle-btn" data-val="2" onclick="app.setSplit(2)">2 <span data-i18n="screens">화면</span></button>
            <button class="toggle-btn" data-val="3" onclick="app.setSplit(3)">3 <span data-i18n="screens">화면</span></button>
          </div>
        </div>

        <!-- Auto-log wait -->
        <div class="panel" id="autoLogPanel">
          <label class="fl" data-i18n="auto_log_wait">자동 기록 대기 (초)</label>
          <input type="number" id="waitTimeInput" class="inp" value="2.0" step="0.5" min="0.1"
                 onchange="app.setWaitTime(parseFloat(this.value))">
        </div>

        <!-- Dynamic instrument settings -->
        <div class="panel" id="settingsArea">
          <div class="panel-title" data-i18n="settings_title">설정</div>
          <div id="dynamicSettings"></div>
        </div>

      </div><!-- .sidebar-top -->

      <!-- System log — fixed at bottom -->
      <div class="syslog-panel" id="syslogPanel">
        <div class="syslog-head">
          <span class="panel-title" style="margin-bottom:0;" data-i18n="syslog_title">SYSTEM LOG</span>
          <button class="logbar-toggle" id="logToggle" onclick="app.toggleLog()">▼</button>
        </div>
        <div id="sysLog" class="syslog"></div>
      </div>

    </aside>

    <!-- CENTER -->
    <main id="center">

      <!-- Live display bar -->
      <div class="display-bar">
        <div class="disp-value">
          <span id="liveValue">— — —</span><span class="disp-unit" id="liveUnit"></span>
        </div>
        <div class="disp-meta">
          <span id="liveStatus" class="disp-status off" data-i18n="disconnected">연결 안됨</span>
          <span class="meas-count"><span data-i18n="meas_count_lbl">측정 수:</span> <b id="measCount">0</b></span>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="panel datalog-head-bar">
        <div class="panel-title" data-i18n="data_panel_title">📋 측정 데이터</div>
        <div class="datalog-actions">
          <button class="sbtn" onclick="app.copyData()" data-i18n="btn_copy">COPY</button>
          <button class="sbtn green" onclick="app.exportCSV()" data-i18n="btn_csv">Export CSV</button>
          <button class="sbtn red" onclick="app.clearData()" data-i18n="btn_clear">Clear Data</button>
        </div>
      </div>

      <!-- Panels (grids) -->
      <div id="panelsContainer" class="panels-scroll"></div>

    </main>

    <!-- RIGHT PANEL -->
    <aside id="rightpanel">
      <div class="panel grow">
        <div class="graph-head">
          <div class="panel-title" data-i18n="dist_panel_title">📊 데이터 분포</div>
        </div>
        <div class="graph-hint" data-i18n="chart_hint">현재 패널의 측정값 분포를 표시합니다.</div>
        <div class="graph-area">
          <canvas id="mainChart"></canvas>
          <div class="graph-empty" id="chartEmpty" data-i18n="chart_empty">측정 데이터가 없습니다</div>
        </div>
        <!-- Per-panel stats -->
        <div id="statsPanel" class="stats-area"></div>
      </div>
    </aside>

  </div><!-- #layout -->

</div><!-- #instrumentView -->

<!-- ── Test Manager Modal ────────────────────────────────────────────────── -->
<div id="testManagerModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)app.closeTestManager()">
  <div class="modal-box">
    <div class="modal-title ok" data-i18n="test_manage">테스트 방법 관리</div>

    <div class="field-label" style="margin-top:4px;" data-i18n="test_add_new">새 평가 방법 추가</div>
    <div class="modal-form">
      <label class="fl" data-i18n="test_name_label">테스트명</label>
      <input id="mgr_name" type="text" class="inp" placeholder="예: ETM-9">
      <div class="param-grid">
        <div>
          <label class="fl" data-i18n="test_total_cells">총 칸 수</label>
          <input id="mgr_total" type="number" class="inp" value="3" min="1" max="30">
        </div>
        <div>
          <label class="fl" data-i18n="test_group_cells">구분 칸 수</label>
          <input id="mgr_group" type="number" class="inp" value="0" min="0">
        </div>
      </div>
      <label class="fl" data-i18n="test_set_group">셋트 크기</label>
      <input id="mgr_set" type="number" class="inp" value="3" min="1">
    </div>
    <button class="big-btn green" style="margin-top:12px;" onclick="app.addTestMode()" data-i18n="btn_add">추가</button>

    <div style="height:1px;background:var(--border);margin:16px 0;"></div>

    <div class="field-label" data-i18n="test_delete_method">기존 평가 방법 삭제</div>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <select id="mgr_del" class="inp" style="flex:1;"></select>
      <button class="sbtn red" onclick="app.deleteTestMode()" data-i18n="btn_delete">삭제</button>
    </div>

    <button class="big-btn" style="margin-top:14px;" onclick="app.closeTestManager()" data-i18n="ag_sop_close">✕ 닫기</button>
  </div>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
